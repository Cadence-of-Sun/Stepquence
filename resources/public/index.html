<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Stepquence</title>
    <!-- Browser chrome colors: the app's background in each theme. They follow
         the system until a theme is chosen; :theme/apply then sets both. -->
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Paths are relative, so the published app works from any folder. -->
    <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // Apply the saved theme before first paint (no bright flash).
      // Kept in sync by the :theme/apply effect.
      try {
        var theme = localStorage.getItem("stepquence.theme") || localStorage.getItem("stepwise.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          var color = theme === "dark" ? "#17181b" : "#f6f4ef";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = color; });
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <noscript>
      Stepquence is a JavaScript app. Please enable JavaScript to continue.
    </noscript>
    <div id="app"></div>
    <script src="js/compiled/app.js"></script>
  </body>
</html>
